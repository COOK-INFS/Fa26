[project]
name = "classexamples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cookinfs", email = "cookinfs@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "diagrams>=0.25.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "manim>=0.22.0",
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[project.scripts]
classexamples = "classexamples:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
